<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
    <link rel="stylesheet" href="styles/registration.css">
</head>
    <body>
        <main>
            <form class="bg-light p-4 m03 border rounded">

                <div class="input-group mb-3">
                    <label class="form-label">Name</label>
                    <input id="productName" class="form-control" type="text" placeholder="Apple">
                </div>

                <div class="input-group mb-3">
                    <label class="form-label">Price</label>
                    <input id="productPrice" class="form-control" type="number" placeholder="10.99">
                </div>

                <div class="input-group mb-3">
                    <label class="form-label">Category</label>
                    <select id="productCategory" class="form-select">
                        <option value="">Select a category</option>
                        <option value="fruits">Fruits</option>
                        <option value="electronics">Electronics</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <button onclick="registerProduct(event)" class="btn btn-primary" type="submit">Register</button>
                    <button class="btn btn-secondary" type="reset">Reset</button>
                </div>
            </form>

            <div id="productsList" class="d-flex flex-wrap">

        </main>
        <script src="scripts/104-forms.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
