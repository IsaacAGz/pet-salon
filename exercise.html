<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/registration.css">
    <title>Document</title>
</head>
<body>
    <main>
        <form id="studentForm" class="bg-light p-4 m03 border rounded">
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Name</span>
                </div>
                <input id="inputName" type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Last Name</span>
                </div>
                <input id="inputLastName" type="text" class="form-control" placeholder="Enter your last name">
            </div>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Cohort</span>
                </div>
                <input id="inputCohort" type="number" class="form-control" placeholder="Enter your cohort">
            </div>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Email</span>
                </div>
                <input id="inputEmail" type="email" class="form-control" placeholder="example@email.com">
            </div>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Class</span>
                </div>
                <select id="inputClass" class="form-select">
                    <option class="dropdown-item" selected>Select a class...</option>
                    <option class="dropdown-item">101</option>
                    <option class="dropdown-item">102</option>
                    <option class="dropdown-item">103</option>
                    <option class="dropdown-item">104</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-3">
                <button onclick="registerStudent(event)" class="btn btn-primary" type="submit">Register</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>
        </form>

        <h2 class="">Students List</h2>
        <table class="table">
            <tr>
                <th>Name</th>
                <th>Last Name</th>
                <th>Cohort</th>
                <th>Email</th>
                <th>Class</th>
                <th>Delete</th>
            </tr>
            
            <tbody id="studentsTable">

            </tbody>
        </table>
        <div id="studentsList" class="d-flex flex-wrap" style="padding: 20px; gap: 20px;">

        </div>

        <button id="testBtn" class="btn btn-danger">Test</button>
    </main>
    <script src="scripts/exercise.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>


</html>
