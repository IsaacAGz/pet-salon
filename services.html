<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/dark-mode.css">
    <title>Services</title>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <button id="changeMode">☀️ Light Mode</button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link active" href="services.html">Services</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="registration.html">Registration</a>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        

        <h1 class="siteTitle">Services</h1>

        <section class="m-5">

            <form class="serviceForm">
                <div class="m-3">
                    <label class="form-label">Service</label>
                    <input id="inputService" class="form-control" type="text" placeholder="Premium Bath">
                </div>

                <div class="m-3">
                    <label class="form-label">Description</label>
                    <input id="inputDescription" class="form-control" type="text" placeholder="Includes...">
                </div>

                <div class="m-3">
                    <label class="form-label">Price</label>
                    <input id="inputPrice" class="form-control" type="number" step="any" placeholder="10.99">
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <button id="registerService" class="btn btn-primary" type="submit">Register</button>
                    <button id="resetForm" class="btn btn-secondary" type="reset">Reset</button>
                </div>
            </form>

        </section>

        <div class="tableContainer">
            <table class="serviceTable">
                <tr>
                    <th>Service</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Delete</th>
                </tr>

                <tbody id="servicesTable">

                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div style="display: flex;  justify-content: space-between; padding: 20px;">
            <div>
                <h3>Pawfect Shine Grooming Studio</h3>
                <p>Address: 123 Bark Avenue, Suite 100</p>
                <p>Phone: (555) 867-5309</p>
                <p>Hours: Tuesday – Sunday | 8:00 AM – 6:00 PM</p>
            </div>
            <div style="display: flex; flex-direction:column; padding-right: 50px;">
                <a href="">Facebook</a>
                <a href="">Instagram</a>
                <a href="">Youtube</a>
            </div>
        </div>
    </footer>

    <!-- JQuery -->
    <script
		src="https://code.jquery.com/jquery-4.0.0.js"
		integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
		crossorigin="anonymous">
    </script>

    <script src="./scripts/services.js"></script>

    <!-- Boostrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
