<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <main class="p-4 d-flex flex-column justify-content-center align-items-centerw-75">
        <div>
            <h1>Local Storage: Save, Get, and Delete Data.</h1>

            <form>
                <div class="input-group m-4">
                    <span class="input-group-text">Username</span>
                    <input id="username" class="form-control" type="text" placeholder="Enter your username...">
                </div>
                <div class="input-group m-4">
                    <span class="input-group-text">Name</span>
                    <input id="name" class="form-control" type="text" placeholder="Enter your name...">
                </div>
                <div class="input-group m-4">
                    <span class="input-group-text">Age</span>
                    <input id="age" class="form-control" type="number" placeholder="Enter your age...">
                </div>
                <div class="input-group m-4">
                    <span class="input-group-text">Email</span>
                    <input id="email" class="form-control" type="email" placeholder="example@email.com">
                </div>
                
            </form>

            <div class="d-flex justify-content-end m-2 gap-3">
                    <button id="saveBtn" class="btn btn-primary">Save</button>
                    <button id="getBtn" class="btn btn-secondary">Get</button>
                    <button id="deleteBtn" class="btn btn-danger">Delete</button>
            </div>

            
        </div>

        <div>
            <h2>Save Data</h2>
        </div>
        <div>
            <p id="usernameDisplay"></p>
            <p id="nameDisplay"></p>
            <p id="ageDisplay"></p>
            <p id="emailDisplay"></p>
        </div>

    </main>
    
    
    <script src="https://code.jquery.com/jquery-4.0.0.js"integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="crossorigin="anonymous"></script>
    <script src="./scripts/105-localstorage.js"></script>
</body>
</html>
